name: keycloak-production
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start]
    init: true
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 900m
    stop_grace_period: 60s
    ports:
      - target: 8443
        published: "${KC_HTTP_PORT:-8082}"
        host_ip: ${KC_BIND_ADDRESS:-127.0.0.1}
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL:?Defina a conexao JDBC de producao}
      KC_DB_USERNAME: ${KC_DB_USERNAME:?Defina o usuario PostgreSQL}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Defina a senha PostgreSQL}
      KC_HOSTNAME: https://sso.pindamonhangaba.sp.gov.br
      KC_HOSTNAME_ADMIN: ${KC_HOSTNAME_ADMIN:-https://sso.pindamonhangaba.sp.gov.br}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${KC_PROXY_TRUSTED_ADDRESSES:?Defina o IP do proxy}
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/server.key
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HEALTH_ENABLED: "true"
      KC_CACHE: local
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "10"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Defina o administrador inicial}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Defina a senha inicial}
    volumes:
      - ./certificates:/certificates:ro,z
      - ./themes:/opt/keycloak/themes:ro,z
      - ./tls:/opt/keycloak/conf/tls:ro,Z
    networks:
      proxy:
        aliases: [keycloak-production]
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy-manager_default}
