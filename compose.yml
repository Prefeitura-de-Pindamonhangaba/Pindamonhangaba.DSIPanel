services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment: &app-environment
      NODE_ENV: production
      APP_URL: ${APP_URL:?Defina APP_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER:?Defina POSTGRES_USER}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Defina POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-false}
      AUTH_BYPASS_ENABLED: ${AUTH_BYPASS_ENABLED:-false}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      GLPI_API_URL: ${GLPI_API_URL:-https://glpi.pindamonhangaba.sp.gov.br/apirest.php/}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-}
      GLPI_DSI_GROUP_ID: ${GLPI_DSI_GROUP_ID:-}
      GLPI_TIME_ZONE: ${GLPI_TIME_ZONE:-America/Sao_Paulo}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks: [frontend, backend]
  tools:
    profiles: [tools]
    build:
      context: .
      target: tools
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend]
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [backend]
volumes:
  postgres_data:
networks:
  frontend:
  backend:
    internal: true
