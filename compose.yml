services:
  app:
    build:
      context: .
      target: runner
    init: true
    cpus: ${APP_CPUS:-1.0}
    mem_limit: ${APP_MEMORY_LIMIT:-768m}
    stop_grace_period: 30s
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment: &app-environment
      NODE_ENV: production
      APP_URL: ${APP_URL:?Defina APP_URL}
      APP_BIND_ADDRESS: ${APP_BIND_ADDRESS:-0.0.0.0}
      APP_PORT: ${APP_PORT:-3000}
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:?Defina POSTGRES_USER}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Defina POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-false}
      AUTH_BYPASS_ENABLED: ${AUTH_BYPASS_ENABLED:-false}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      GLPI_API_URL: ${GLPI_API_URL:-https://glpi.pindamonhangaba.sp.gov.br/apirest.php/}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-}
      GLPI_DSI_GROUP_ID: ${GLPI_DSI_GROUP_ID:-}
      GLPI_TIME_ZONE: ${GLPI_TIME_ZONE:-America/Sao_Paulo}
    volumes: &public-ca-volumes
      - ./certificates:/certificates:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/brand/prefeitura-pindamonhangaba.svg',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks: [frontend, backend]
  proxy:
    image: caddy:2.11.7-alpine
    entrypoint: ["/bin/sh", "/etc/caddy/start-proxy.sh"]
    init: true
    ports:
      - target: ${APP_PORT:-3000}
        published: "${APP_PORT:-3000}"
        host_ip: ${APP_BIND_ADDRESS:-0.0.0.0}
        protocol: tcp
    environment:
      APP_URL: ${APP_URL:?Defina APP_URL}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/start-proxy.sh:/etc/caddy/start-proxy.sh:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:2019/config/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    cpus: ${PROXY_CPUS:-0.5}
    mem_limit: ${PROXY_MEMORY_LIMIT:-128m}
    stop_grace_period: 30s
    logging: *bounded-logging
    restart: unless-stopped
    networks: [frontend]
  tools:
    profiles: [tools]
    build:
      context: .
      target: tools
    environment: *app-environment
    volumes: *public-ca-volumes
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend]
  db:
    image: postgres:17.6-alpine
    cpus: ${POSTGRES_CPUS:-1.0}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    stop_grace_period: 30s
    logging: *bounded-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [backend]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  frontend:
  backend:
    internal: true
